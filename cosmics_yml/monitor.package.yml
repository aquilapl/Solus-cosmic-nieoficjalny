# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name        : cosmic-monitor
version     : 1.5.0
release     : 5
summary     : Cosmic System Monitor
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-monitor

description : |
    Cosmic System Monitor

source      :
    - https://github.com/pop-os/cosmic-monitor/archive/refs/tags/epoch-1.5.0.tar.gz : 16ab01337bbaf578b0621a17c4af2c870e45fa4aa767ce041638000b0d3817c1

networking  : true

builddeps   :
    - just
    - rust
    - pkgconfig(xkbcommon)

setup       : |
    unset DISPLAY SUDO_USER SUDO_GID SUDO_UID SUDO_COMMAND CDPATH
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked --all

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
    %install_license LICENSE
