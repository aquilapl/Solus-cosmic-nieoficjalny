name        : cosmic-monitor
version     : 1.10.0
release     : 13
summary     : Cosmic System Monitor
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-monitor

description : |
    Cosmic System Monitor

source      :
- https://github.com/pop-os/cosmic-monitor/archive/refs/tags/epoch-1.10.0.tar.gz : ad05af39c240f252bf1191a58563c3d3e858afeeec8334879bba0050c9697496

networking  : true

builddeps   :
    - just
    - rust
    - pkgconfig(xkbcommon)

setup       : |
    unset DISPLAY SUDO_USER SUDO_GID SUDO_UID SUDO_COMMAND CDPATH
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked --all

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
