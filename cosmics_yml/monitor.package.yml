name        : cosmic-monitor
version     : 1.9.0
release     : 9
summary     : Cosmic System Monitor
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-monitor

description : |
    Cosmic System Monitor

source      :
        - https://github.com/pop-os/cosmic-monitor/archive/refs/tags/epoch-1.9.0.tar.gz : 2ef7102ddfc982bd4c3e70632bce1b0e5bb2d6d96fb830a3ac8db0b2fff47709

networking  : true

builddeps   :
    - just
    - rust
    - pkgconfig(xkbcommon)

setup       : |
    unset DISPLAY SUDO_USER SUDO_GID SUDO_UID SUDO_COMMAND CDPATH
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked --all

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
