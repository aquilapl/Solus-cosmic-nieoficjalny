name        : cosmic-osd
version     : 1.9.0
release     : 51
summary     : Cosmic Desktop OSD
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-osd

description : |
    Cosmic Desktop OSD

source      :
    - https://github.com/pop-os/cosmic-osd/archive/refs/tags/epoch-1.9.0.tar.gz : 7f4e7e991f9201bacb0d0c3c47d160419de849710f16c9deb29a3aaeb82b0de3

builddeps   :
    - just
    - rust
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(xkbcommon)

rundeps     :
    - polkit

networking  : true

environment : |
    export LIBDIR=/usr/lib64
    export POLKIT_AGENT_HELPER_1=/usr/lib64/polkit-1/polkit-agent-helper-1

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    export LIBDIR=/usr/lib64
    export POLKIT_AGENT_HELPER_1=/usr/lib64/polkit-1/polkit-agent-helper-1
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
