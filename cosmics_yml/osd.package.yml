name        : cosmic-osd
version     : 1.10.0
release     : 55
summary     : Cosmic Desktop OSD
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-osd

description : |
    Cosmic Desktop OSD

source      :
- https://github.com/pop-os/cosmic-osd/archive/refs/tags/epoch-1.10.0.tar.gz : 41cd18721bee2c9123a9fb5f8c09617ad0033f5cf688933fff47f6ac28c825c0

builddeps   :
    - just
    - rust
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(xkbcommon)

rundeps     :
    - polkit

networking  : true

environment : |
    export LIBDIR=/usr/lib64
    export POLKIT_AGENT_HELPER_1=/usr/lib64/polkit-1/polkit-agent-helper-1

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    export LIBDIR=/usr/lib64
    export POLKIT_AGENT_HELPER_1=/usr/lib64/polkit-1/polkit-agent-helper-1
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
