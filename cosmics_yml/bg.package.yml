name        : cosmic-bg
version     : 1.10.0
release     : 57
summary     : Cosmic Desktop Background Service
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-bg

description : |
    Cosmic Desktop Background Service

source      :
    - https://github.com/pop-os/cosmic-bg/archive/refs/tags/epoch-1.10.0.tar.gz : 1595505815bdf96cf4cfd16736a1d235cb249d78e4a35dccd02e3c997649b357

networking  : true

builddeps   :
    - pkgconfig(dav1d)
    - pkgconfig(xkbcommon)
    - rust
    - which
    - just

setup       : |
    %patch -p1 -i $pkgfiles/aerynos_branding.patch
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install

