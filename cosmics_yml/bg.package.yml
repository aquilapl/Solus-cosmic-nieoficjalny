name        : cosmic-bg
version     : 1.9.0
release     : 52
summary     : Cosmic Desktop Background Service
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-bg

description : |
    Cosmic Desktop Background Service

source      :
    - https://github.com/pop-os/cosmic-bg/archive/refs/tags/epoch-1.9.0.tar.gz :  848594cabc13d78fef20a907bc79aa2b132986e40bb042b9423779bfc081dcca

networking  : true

builddeps   :
    - pkgconfig(dav1d)
    - pkgconfig(xkbcommon)
    - rust
    - which
    - just

setup       : |
    %patch -p1 -i $pkgfiles/aerynos_branding.patch
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install

