# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name        : cosmic-bg
version     : 1.5.0
release     : 48
summary     : Cosmic Desktop Background Service
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-bg

description : |
    Cosmic Desktop Background Service

source      :
    - https://github.com/pop-os/cosmic-bg/archive/refs/tags/epoch-1.5.0.tar.gz : 12b30c60e15ac6c0f4b3eca8c37642145683e830833b429958222dfc395db177

networking  : true

builddeps   :
    - pkgconfig(dav1d)
    - pkgconfig(xkbcommon)
    - rust
    - which
    - just

setup       : |
    %patch -p1 -i $pkgfiles/aerynos_branding.patch
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
    %install_license LICENSE.md

