name        : cosmic-player
version     : 1.10.0
release     : 47
summary     : COSMIC media player
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-player

description : |
    Cosmic Desktop Media Player

source      :
    - https://github.com/pop-os/cosmic-player/archive/refs/tags/epoch-1.10.0.tar.gz : 421bf528742a737e8a99b9ea7ce753a5ddc8a37f7f694e774292a539e793f5b6

networking  : true

builddeps   :
    - just
    - rust
    - which
    - pkgconfig(gstreamer-1.0)
    - pkgconfig(gstreamer-plugins-base-1.0)
    - pkgconfig(xkbcommon)

rundeps     :
    - gstreamer-plugins-good

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install

