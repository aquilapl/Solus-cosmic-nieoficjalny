name        : cosmic-notifications
version     : 1.9.0
release     : 51
summary     : Cosmic Desktop Notifications
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-notifications

description : |
    Cosmic Desktop Notifications

source      :
    - https://github.com/pop-os/cosmic-notifications/archive/refs/tags/epoch-1.9.0.tar.gz : 36fb0a639461432f77df30e8d065ecc536a64a8504e2eebe4b0dcd054cffad08

networking  : true

builddeps   :
    - just
    - which
    - rust
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)

setup       : |
    unset DISPLAY SUDO_USER SUDO_GID SUDO_UID SUDO_COMMAND CDPATH
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked --all

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
