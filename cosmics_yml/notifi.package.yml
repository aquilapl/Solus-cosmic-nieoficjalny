# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name        : cosmic-notifications
version     : 1.5.0
release     : 47
summary     : Cosmic Desktop Notifications
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-notifications

description : |
    Cosmic Desktop Notifications

source      :
    - https://github.com/pop-os/cosmic-notifications/archive/refs/tags/epoch-1.5.0.tar.gz : 8c60dd4c2161a2b9d2314597e141c600da9882fe774858283303370b2409ead7

networking  : true

builddeps   :
    - just
    - which
    - rust
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)

setup       : |
    unset DISPLAY SUDO_USER SUDO_GID SUDO_UID SUDO_COMMAND CDPATH
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked --all

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
    %install_license LICENSE.md
