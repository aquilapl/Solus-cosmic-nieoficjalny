name        : cosmic-notifications
version     : 1.10.0
release     : 55
summary     : Cosmic Desktop Notifications
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-notifications

description : |
    Cosmic Desktop Notifications

source      :
- https://github.com/pop-os/cosmic-notifications/archive/refs/tags/epoch-1.10.0.tar.gz : 73992c11fd16aa695279f78ed412f07cb71b3d62ca4999e2e6fcd44155c8550c

networking  : true

builddeps   :
    - just
    - which
    - rust
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)

setup       : |
    unset DISPLAY SUDO_USER SUDO_GID SUDO_UID SUDO_COMMAND CDPATH
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked --all

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
