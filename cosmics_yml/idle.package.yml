name        : cosmic-idle
version     : 1.9.0
release     : 45
summary     : Cosmic Desktop Idle Daemon
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-idle

description : |
    Cosmic Desktop Idle Daemon

source      :
   - https://github.com/pop-os/cosmic-idle/archive/refs/tags/epoch-1.9.0.tar.gz : acdd250cc845879352b1707c25636145dbdc3f0b4d17724d9a031e789a0592f1

networking  : true

builddeps   :
    - just
    - pkgconfig(xkbcommon)
    - rust
    - which

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install

