name        : cosmic-idle
version     : 1.10.0
release     : 49
summary     : Cosmic Desktop Idle Daemon
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-idle

description : |
    Cosmic Desktop Idle Daemon

source      :
- https://github.com/pop-os/cosmic-idle/archive/refs/tags/epoch-1.10.0.tar.gz : 532074f48a9c0c23bebfcc171b527a732fa8850ce83f3cd2f4ca5926ef6fbac7

networking  : true

builddeps   :
    - just
    - pkgconfig(xkbcommon)
    - rust
    - which

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install

