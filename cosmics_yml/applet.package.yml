name        : cosmic-applets
version     : 1.10.0
release     : 61
summary     : Cosmic Panel Applets
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-applets

description : |
    Cosmic Panel Applets

source      :
- https://github.com/pop-os/cosmic-applets/archive/refs/tags/epoch-1.10.0.tar.gz : fa922a252d87eeb37e5847fa6840e321f9f75961ae3c9bd6d7ab1b779779f08e

networking  : true

builddeps   :
    - just
    - pkgconfig(dbus-1)
    - pkgconfig(glib-2.0)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(libudev)
    - pkgconfig(wayland-client)
    - pkgconfig(xkbcommon)
    - rust

rundeps     :
    - bluez

setup       : |
    cargo fetch --locked

build       : |
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
