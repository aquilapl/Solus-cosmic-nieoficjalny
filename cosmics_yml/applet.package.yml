name        : cosmic-applets
version     : 1.9.0
release     : 57
summary     : Cosmic Panel Applets
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-applets

description : |
    Cosmic Panel Applets

source      :
    - https://github.com/pop-os/cosmic-applets/archive/refs/tags/epoch-1.9.0.tar.gz : f113f74cd05b179ab0478dd5876b671880914600d5df56d518f8f80c08543037

networking  : true

builddeps   :
    - just
    - pkgconfig(dbus-1)
    - pkgconfig(glib-2.0)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(libudev)
    - pkgconfig(wayland-client)
    - pkgconfig(xkbcommon)
    - rust

rundeps     :
    - bluez

setup       : |
    cargo fetch --locked

build       : |
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
