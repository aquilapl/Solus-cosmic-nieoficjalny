# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name        : cosmic-applets
version     : 1.5.0
release     : 53
summary     : Cosmic Panel Applets
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-applets

description : |
    Cosmic Panel Applets

source      :
    - https://github.com/pop-os/cosmic-applets/archive/refs/tags/epoch-1.5.0.tar.gz : ac9328e58f5e9cb9c7561a2ce4af212d4916d97c820741f0959366c7e1a0e3ba

networking  : true

builddeps   :
    - just
    - pkgconfig(dbus-1)
    - pkgconfig(glib-2.0)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(libudev)
    - pkgconfig(wayland-client)
    - pkgconfig(xkbcommon)
    - rust

rundeps     :
    - bluez

setup       : |
    cargo fetch --locked

build       : |
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
    %install_license LICENSE
