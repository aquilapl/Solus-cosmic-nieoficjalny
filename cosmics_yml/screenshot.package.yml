name        : cosmic-screenshot
version     : 1.10.0
release     : 55
summary     : Cosmic Screenshot Tool
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-screenshot

description : |
    Cosmic Screenshot Tool

source      :
    - https://github.com/pop-os/cosmic-screenshot/archive/refs/tags/epoch-1.10.0.tar.gz : 1f74e8ac311e564dd1bac64a2bf02aa095e9c98222be832c2b3366124b3a5000

networking  : true

builddeps   :
    - just
    - rust
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)

setup       : |
    unset DISPLAY SUDO_USER SUDO_GID SUDO_UID SUDO_COMMAND CDPATH
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked --all

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
