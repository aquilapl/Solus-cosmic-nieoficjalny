# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name        : cosmic-screenshot
version     : 1.5.0
release     : 46
summary     : Cosmic Screenshot Tool
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-screenshot

description : |
    Cosmic Screenshot Tool

source      :
    - https://github.com/pop-os/cosmic-screenshot/archive/refs/tags/epoch-1.5.0.tar.gz : 2a0a1fb18303773fbfe54613b0b5603871a72cbbb5b0ae183b5390227671b9a3

networking  : true

builddeps   :
    - just
    - rust
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)

setup       : |
    unset DISPLAY SUDO_USER SUDO_GID SUDO_UID SUDO_COMMAND CDPATH
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked --all

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
    %install_license LICENSE
