name        : cosmic-screenshot
version     : 1.9.0
release     : 50
summary     : Cosmic Screenshot Tool
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-screenshot

description : |
    Cosmic Screenshot Tool

source      :
      - https://github.com/pop-os/cosmic-screenshot/archive/refs/tags/epoch-1.9.0.tar.gz : 2f809f4e1ed8ca218b9d39975cee290d168f231b48204a4d91d75ee63f30abcb

networking  : true

builddeps   :
    - just
    - rust
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)

setup       : |
    unset DISPLAY SUDO_USER SUDO_GID SUDO_UID SUDO_COMMAND CDPATH
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked --all

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
