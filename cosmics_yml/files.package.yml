# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name        : cosmic-files
version     : 1.5.0
release     : 53
summary     : Cosmic Desktop File Browser
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-files

description : |
    Cosmic desktop File Browser

source      :
    - https://github.com/pop-os/cosmic-files/archive/refs/tags/epoch-1.5.0.tar.gz : da8567bcd0a15ca6522a8800ec800701f8e994ef5da52513b3afdf95370e3bf1

networking  : true

builddeps   :
    - just
    - which
    - pkgconfig(bzip2)
    - pkgconfig(glib-2.0)
    - pkgconfig(liblzma)
    - pkgconfig(libzstd)
    - pkgconfig(xkbcommon)
    - rust

rundeps     :
    - gvfs

environment : |
    export ZSTD_SYS_USE_PKG_CONFIG=1

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked -p cosmic-files
    cargo build --release --locked -p cosmic-files-applet

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
    %install_license LICENSE

