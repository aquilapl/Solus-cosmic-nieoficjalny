name        : cosmic-files
version     : 1.9.0
release     : 58
summary     : Cosmic Desktop File Browser
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-files

description : |
    Cosmic desktop File Browser

source      :
        - https://github.com/pop-os/cosmic-files/archive/refs/tags/epoch-1.9.0.tar.gz : c30cb40b8177112c821753a95134ba82e64dfd8230f5c371a1c89a4b0d066309

networking  : true

builddeps   :
    - just
    - which
    - pkgconfig(bzip2)
    - pkgconfig(glib-2.0)
    - pkgconfig(liblzma)
    - pkgconfig(libzstd)
    - pkgconfig(xkbcommon)
    - rust

rundeps     :
    - gvfs

environment : |
    export ZSTD_SYS_USE_PKG_CONFIG=1

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    %cargo_build -p cosmic-files
    %cargo_build -p cosmic-files-applet
    %cargo_build -p cosmic-files-thumbnailer

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install

