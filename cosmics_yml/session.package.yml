name        : cosmic-session
version     : 1.10.0
release     : 68
summary     : Cosmic Session Management
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-session

description : |
    Cosmic Session Management

source      :
    - https://github.com/pop-os/cosmic-session/archive/refs/tags/epoch-1.10.0.tar.gz : 9eafc77c833ae8da30c2d20c751fd585b4e699b4e4bbad44760ab70089923825

networking  : true

builddeps   :
    - just
    - rust
    - which
    - pkgconfig(xkbcommon)

rundeps     :
    - gawk
    - bolt
    - cosmic-applibrary
    - cosmic-bg
    - cosmic-comp
    - cosmic-files
    - cosmic-greeter
    - cosmic-idle
    - cosmic-notifications
    - cosmic-osd
    - cosmic-panel
    - cosmic-randr
    - cosmic-settings
    - cosmic-settings-daemon
    - cosmic-workspaces
    - gnome-keyring
    - switcheroo-control
    - desktop-file-utils
    - shared-mime-info
    - upower
    - xdg-user-dirs-gtk
    - accountsservice
    - noto-sans-ttf
    - pciutils
    - wireplumber
    - xdg-desktop-portal-cosmic

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install

    install -Dm644 data/dconf/profile/cosmic $installdir$datadir/dconf/profile/cosmic

