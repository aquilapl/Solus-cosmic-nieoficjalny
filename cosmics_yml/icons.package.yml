name        : cosmic-icons
version     : 1.9.0
release     : 50
summary     : Cosmic Icons by System76
component   : desktop
license     : CC-BY-SA-4.0
homepage    : https://github.com/pop-os/cosmic-icons

source      :
  - https://github.com/pop-os/cosmic-icons/archive/refs/tags/epoch-1.9.0.tar.gz : 1b15f26b5a6b876aaeb82fd51c1bf242b2c26bb5899105dd03168feba4896ae5

description : |
  Cosmic Icons by System76

builddeps   :
  - just
  - hicolor-icon-theme
  - pkgconfig(gtk+-3.0)

rundeps     :
  - adwaita-icon-theme

install     : |
  just rootdir="$installdir" install

  if command -v gtk-update-icon-cache >/dev/null 2>&1; then
    for i in "$installdir/usr/share/icons"/*/; do
      [ -d "$i" ] || continue
      gtk-update-icon-cache -f "$i" || true
    done
  else
    echo "gtk-update-icon-cache not found; skipping icon cache update"
  fi
