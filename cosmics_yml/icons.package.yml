name        : cosmic-icons
version     : 1.10.0
release     : 54
summary     : Cosmic Icons by System76
component   : desktop
license     : CC-BY-SA-4.0
homepage    : https://github.com/pop-os/cosmic-icons

source      :
- https://github.com/pop-os/cosmic-icons/archive/refs/tags/epoch-1.10.0.tar.gz : 52625bef1b83ba2b08afe58197573738d72fb4d316de9d99eac34806a4cae80c

description : |
  Cosmic Icons by System76

builddeps   :
  - just
  - hicolor-icon-theme
  - pkgconfig(gtk+-3.0)

rundeps     :
  - adwaita-icon-theme

install     : |
  just rootdir="$installdir" install

  if command -v gtk-update-icon-cache >/dev/null 2>&1; then
    for i in "$installdir/usr/share/icons"/*/; do
      [ -d "$i" ] || continue
      gtk-update-icon-cache -f "$i" || true
    done
  else
    echo "gtk-update-icon-cache not found; skipping icon cache update"
  fi
