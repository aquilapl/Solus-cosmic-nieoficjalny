name        : cosmic-icons
version     : 1.5.0
release     : 46
summary     : Cosmic Icons by System76
component   : desktop
license     : CC-BY-SA-4.0
homepage    : https://github.com/pop-os/cosmic-icons

source      :
  - https://github.com/pop-os/cosmic-icons/archive/refs/tags/epoch-1.5.0.tar.gz : e6caffc4c93f5afdaae3fbda4f3cc14363d3539cda1b0c5f478d32a8bb141c4c

description : |
  Cosmic Icons by System76

builddeps   :
  - just
  - hicolor-icon-theme
  - pkgconfig(gtk+-3.0)

rundeps     :
  - adwaita-icon-theme

install     : |
  just rootdir="$installdir" install

  if command -v gtk-update-icon-cache >/dev/null 2>&1; then
    for i in "$installdir/usr/share/icons"/*/; do
      [ -d "$i" ] || continue
      gtk-update-icon-cache -f "$i" || true
    done
  else
    echo "gtk-update-icon-cache not found; skipping icon cache update"
  fi
