name        : xdg-desktop-portal-cosmic
version     : 1.9.0
release     : 53
summary     : Cosmic Desktop - XDG Portal Support
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/xdg-desktop-portal-cosmic

description : |
    Cosmic Desktop - XDG Portal Support

source      :
    - https://github.com/pop-os/xdg-desktop-portal-cosmic/archive/refs/tags/epoch-1.9.0.tar.gz : 4fcd4631348e98decfd991489a5e9a941792741f5cf127f8ca9e874056c144d6

networking  : true

builddeps   :
    - just
    - rust
    - pkgconfig(gbm)
    - pkgconfig(glib-2.0)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(xkbcommon)

rundeps     :
    - pipewire
    - gvfs 
    - xdg-desktop-portal

setup       : |
    unset DISPLAY SUDO_USER SUDO_GID SUDO_UID SUDO_COMMAND CDPATH
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked --all

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
