# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name        : xdg-desktop-portal-cosmic
version     : 1.5.0
release     : 49
summary     : Cosmic Desktop - XDG Portal Support
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/xdg-desktop-portal-cosmic

description : |
    Cosmic Desktop - XDG Portal Support

source      :
    - https://github.com/pop-os/xdg-desktop-portal-cosmic/archive/refs/tags/epoch-1.5.0.tar.gz : 3ac591232cbbbe47e5fc6264dde6f223bfe3d6711045fd3a1fc99a1c9453da81

networking  : true

builddeps   :
    - just
    - rust
    - pkgconfig(gbm)
    - pkgconfig(glib-2.0)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(xkbcommon)

rundeps     :
    - pipewire
    - gvfs 
    - xdg-desktop-portal

setup       : |
    unset DISPLAY SUDO_USER SUDO_GID SUDO_UID SUDO_COMMAND CDPATH
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked --all

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
    %install_license LICENSE
