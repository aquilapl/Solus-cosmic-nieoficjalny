name        : xdg-desktop-portal-cosmic
version     : 1.10.0
release     : 57
summary     : Cosmic Desktop - XDG Portal Support
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/xdg-desktop-portal-cosmic

description : |
    Cosmic Desktop - XDG Portal Support

source      :
- https://github.com/pop-os/xdg-desktop-portal-cosmic/archive/refs/tags/epoch-1.10.0.tar.gz : b80b6f443ddb1a43b6c02bb1e81ab1b9c1e93724990576ac88d88ef1ccc9c699

networking  : true

builddeps   :
    - just
    - rust
    - pkgconfig(gbm)
    - pkgconfig(glib-2.0)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(xkbcommon)

rundeps     :
    - pipewire
    - gvfs 
    - xdg-desktop-portal

setup       : |
    unset DISPLAY SUDO_USER SUDO_GID SUDO_UID SUDO_COMMAND CDPATH
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked --all

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
