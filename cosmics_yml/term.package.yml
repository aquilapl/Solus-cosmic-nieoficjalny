name        : cosmic-term
version     : 1.9.0
release     : 54
summary     : Cosmic Desktop Terminal Application
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-term

description : |
    Cosmic desktop Terminal Application

source      :
    - https://github.com/pop-os/cosmic-term/archive/refs/tags/epoch-1.9.0.tar.gz : 2e5ef9ff8428503024f84e9d0c9d8b0007dec0be42b398e5925d209ec91e2e19

networking  : true

builddeps   :
    - just
    - rust
    - which
    - pkgconfig(xkbcommon)

rundeps     : []

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install

