name        : cosmic-term
version     : 1.10.0
release     : 59
summary     : Cosmic Desktop Terminal Application
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-term

description : |
    Cosmic desktop Terminal Application

source      :
    - https://github.com/pop-os/cosmic-term/archive/refs/tags/epoch-1.10.0.tar.gz : 0dc1af0a467cf8c9f85f7c7bb0a89e8fde067c7945b7edabd924a370c8083ac9

networking  : true

builddeps   :
    - just
    - rust
    - which
    - pkgconfig(xkbcommon)

rundeps     : []

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install

