name        : cosmic-edit
version     : 1.9.0
release     : 55
summary     : Cosmic Desktop Text Editor
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-edit

description : |
    Cosmic desktop Text Editor

source      :
    - https://github.com/pop-os/cosmic-edit/archive/refs/tags/epoch-1.9.0.tar.gz : 2748de5388e637c8390801961961b063e1c15778c33912cdc62448994194a789

networking  : true

builddeps   :
    - just
    - pkgconfig(glib-2.0)
    - pkgconfig(xkbcommon)
    - rust
    - which

rundeps     :
    - gvfs

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install

