# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name        : cosmic-edit
version     : 1.5.0
release     : 51
summary     : Cosmic Desktop Text Editor
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-edit

description : |
    Cosmic desktop Text Editor

source      :
    - https://github.com/pop-os/cosmic-edit/archive/refs/tags/epoch-1.5.0.tar.gz : d567902b1e04829eedd428cd37372137908947cfafccc14ba485b1ad58832cba

networking  : true

builddeps   :
    - just
    - pkgconfig(glib-2.0)
    - pkgconfig(xkbcommon)
    - rust
    - which

rundeps     :
    - gvfs

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
    %install_license LICENSE

