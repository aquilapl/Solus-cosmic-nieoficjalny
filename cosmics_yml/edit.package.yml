name        : cosmic-edit
version     : 1.10.0
release     : 59
summary     : Cosmic Desktop Text Editor
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-edit

description : |
    Cosmic desktop Text Editor

source      :
- https://github.com/pop-os/cosmic-edit/archive/refs/tags/epoch-1.10.0.tar.gz : 2cd6e262d5762a62df6e27691b76991ebd0aa7674436e78f8bbee3d4bf8c9ec2

networking  : true

builddeps   :
    - just
    - pkgconfig(glib-2.0)
    - pkgconfig(xkbcommon)
    - rust
    - which

rundeps     :
    - gvfs

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install

