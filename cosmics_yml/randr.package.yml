name        : cosmic-randr
version     : 1.9.0
release     : 48
summary     : Cosmic Desktop display configuration
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-randr

description : |
    Cosmic Desktop display configuration

source      :
    - https://github.com/pop-os/cosmic-randr/archive/refs/tags/epoch-1.9.0.tar.gz : 6c082cba6b80c5d89b02aec7ed315c9de8452cd413f5181ece43d7fdb3011481

networking  : true

builddeps   :
    - just
    - which
    - rust
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)

setup       : |
    unset DISPLAY SUDO_USER SUDO_GID SUDO_UID SUDO_COMMAND CDPATH
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked --all

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
