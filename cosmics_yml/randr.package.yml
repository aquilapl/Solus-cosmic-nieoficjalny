name        : cosmic-randr
version     : 1.10.0
release     : 52
summary     : Cosmic Desktop display configuration
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-randr

description : |
    Cosmic Desktop display configuration

source      :
- https://github.com/pop-os/cosmic-randr/archive/refs/tags/epoch-1.10.0.tar.gz : 4556bc8954b212b74aabc60960c1f5f63af1c3cb3abe6b7e00d8278094a6ab1c

networking  : true

builddeps   :
    - just
    - which
    - rust
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)

setup       : |
    unset DISPLAY SUDO_USER SUDO_GID SUDO_UID SUDO_COMMAND CDPATH
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked --all

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
