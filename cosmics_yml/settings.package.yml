name        : cosmic-settings
version     : 1.9.0
release     : 59
summary     : Cosmic Desktop Settings
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-settings

description : |
    Cosmic Desktop Settings

source      :
    - https://github.com/pop-os/cosmic-settings/archive/refs/tags/epoch-1.9.0.tar.gz : 1e33fec9dc70408a85eca4055dca16afa82baadc2edb957e1400294b09f2ff27

networking  : true

builddeps   :
    - just
    - rust
    - which
    - pkgconfig(dav1d)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)

rundeps     : []

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install

