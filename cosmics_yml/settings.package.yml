name        : cosmic-settings
version     : 1.10.0
release     : 63
summary     : Cosmic Desktop Settings
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-settings

description : |
    Cosmic Desktop Settings

source      :
- https://github.com/pop-os/cosmic-settings/archive/refs/tags/epoch-1.10.0.tar.gz : d11ba9d67d3fa279b659e31d64024366358b3f207ce6fe25564772805e517f34

networking  : true

builddeps   :
    - just
    - rust
    - which
    - pkgconfig(dav1d)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)

rundeps     : []

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install

