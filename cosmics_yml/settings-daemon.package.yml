name        : cosmic-settings-daemon
version     : 1.10.0
release     : 57
summary     : Cosmic Settings Daemon
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-settings-daemon

description : |
    Cosmic Settings Daemon

source      :
- https://github.com/pop-os/cosmic-settings-daemon/archive/refs/tags/epoch-1.10.0.tar.gz : e9a193e32857139fa00fcccf8c0ee42d3480b456e4ab8ade1a4cbfed93c70e28

networking  : true

builddeps   :
    - just
    - mold
    - rust
    - pkgconfig(libgeoclue-2.0)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)

rundeps     :
    - cosmic-sound-theme
    - geoclue
    - power-profiles-daemon

setup       : |
    unset DISPLAY SUDO_USER SUDO_GID SUDO_UID SUDO_COMMAND CDPATH
    unset RUSTC_WRAPPER
    export GEOCLUE_AGENT="$(realpath $libdir/geoclue/geoclue-2.0/demos/agent)"
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    export GEOCLUE_AGENT="$(realpath $libdir/geoclue/geoclue-2.0/demos/agent)"
    cargo build --release --locked --bin cosmic-settings-daemon

install     : |
   CARGO_TARGET_DIR="target" just rootdir=$installdir install
