name        : cosmic-panel
version     : 1.9.0
release     : 52
summary     : Cosmic Desktop Panel
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-panel

description : |
    Cosmic Desktop panel

source      :
   - https://github.com/pop-os/cosmic-panel/archive/refs/tags/epoch-1.9.0.tar.gz : 6b036076e162568b6d0230ab82916b30d06b4942cb5be6a39960e42b499cab9b

networking  : true

builddeps   :
    - just
    - rust
    - which
    - pkgconfig(xkbcommon)

rundeps     :
    - cosmic-applets

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install

