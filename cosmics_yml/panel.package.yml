name        : cosmic-panel
version     : 1.10.0
release     : 57
summary     : Cosmic Desktop Panel
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-panel

description : |
    Cosmic Desktop panel

source      :
    - https://github.com/pop-os/cosmic-panel/archive/refs/tags/epoch-1.10.0.tar.gz : e532f3ed38cfe911fb71f62a782de50f41488c2d39a24b09708f141826e8e343

networking  : true

builddeps   :
    - just
    - rust
    - which
    - pkgconfig(xkbcommon)

rundeps     :
    - cosmic-applets

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install

