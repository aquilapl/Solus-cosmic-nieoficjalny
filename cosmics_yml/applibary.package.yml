# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name: cosmic-applibrary
version     : 1.10.0
release     : 57
source:
    - https://github.com/pop-os/cosmic-applibrary/archive/refs/tags/epoch-1.10.0.tar.gz : 43ce4f50c97d2106ac981080d8372e03c50af28660a6737400920ecbc6ce4b39
license: GPL-3.0
homepage: https://github.com/pop-os/cosmic-applibrary
summary: Cosmic Desktop App Launcher
description: |
    Cosmic Desktop App Launcher
networking: true
builddeps:
    - just
    - pkgconfig(libudev)
    - pkgconfig(dbus-1)
    - pkgconfig(xkbcommon)
    - cargo-c
setup: |
    %patch -p1 -i $pkgfiles/Install-static-desktop-and-metainfo-files.patch
    %cargo_fetch
build: |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
