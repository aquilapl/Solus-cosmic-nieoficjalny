# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name: cosmic-applibrary
version: 1.9.0
release: 52
source:
    - https://github.com/pop-os/cosmic-applibrary/archive/refs/tags/epoch-1.9.0.tar.gz : d85fb7648429bb3319dc1f1dd69f510019d4f5815be93c42a3f57f2211abe740
license: GPL-3.0
homepage: https://github.com/pop-os/cosmic-applibrary
summary: Cosmic Desktop App Launcher
description: |
    Cosmic Desktop App Launcher
networking: true
builddeps:
    - just
    - pkgconfig(libudev)
    - pkgconfig(dbus-1)
    - pkgconfig(xkbcommon)
    - cargo-c
setup: |
    %patch -p1 -i $pkgfiles/Install-static-desktop-and-metainfo-files.patch
    %cargo_fetch
build: |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install
