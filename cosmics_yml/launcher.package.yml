name        : cosmic-launcher
version     : 1.10.0
release     : 56
summary     : Cosmic Desktop Launcher
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-launcher

description : |
    Cosmic Desktop Launcher

source      :
- https://github.com/pop-os/cosmic-launcher/archive/refs/tags/epoch-1.10.0.tar.gz : 6700ad7c036b323f877fbedd43d021f50128651af4265554466eb3847013774a

networking  : true

builddeps   :
    - just
    - pkgconfig(xkbcommon)
    - rust
    - which

rundeps     : 
    - pop-os-launcher

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install

