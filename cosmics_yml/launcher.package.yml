name        : cosmic-launcher
version     : 1.9.0
release     : 52
summary     : Cosmic Desktop Launcher
component   : desktop
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-launcher

description : |
    Cosmic Desktop Launcher

source      :
     - https://github.com/pop-os/cosmic-launcher/archive/refs/tags/epoch-1.9.0.tar.gz : 9ded0bbe14a08f4b83da8124d1243c965cf71751dc7d94539dd71ad5a4eff54a

networking  : true

builddeps   :
    - just
    - pkgconfig(xkbcommon)
    - rust
    - which

rundeps     : 
    - pop-os-launcher

setup       : |
    unset RUSTC_WRAPPER
    cargo fetch --locked

build       : |
    unset RUSTC_WRAPPER
    cargo build --release --locked

install     : |
    CARGO_TARGET_DIR="target" just rootdir=$installdir install

