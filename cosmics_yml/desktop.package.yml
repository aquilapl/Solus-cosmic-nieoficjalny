name        : cosmic-desktop
version     : 1.9
release     : 18
component   : desktop
summary     : Cosmic Desktop Metapackage
license     : GPL-3.0
homepage    : https://system76.com/cosmic

source      :
    - https://github.com/pop-os/cosmic-epoch/archive/refs/tags/epoch-1.9.0.tar.gz : 64e9a8abaa05636bf9b3025b073ea46a47fa50c795a812e8b8b2c0226b5c8482

extract     : false

description : |
    Cosmic Desktop Metapackage

rundeps     :
    - cosmic-applets
    - cosmic-applibrary
    - cosmic-bg
    - cosmic-comp
    - cosmic-edit
    - cosmic-files
    - cosmic-greeter
    - cosmic-icons
    - cosmic-idle
    - cosmic-initial-setup
    - cosmic-launcher
    - cosmic-monitor
    - cosmic-notifications
    - cosmic-osd
    - cosmic-panel
    - cosmic-player
    - cosmic-randr
    - cosmic-screenshot
    - cosmic-session
    - cosmic-settings
    - cosmic-settings-daemon
    - cosmic-sound-theme
    - cosmic-store
    - cosmic-term
    - cosmic-viewer
    - cosmic-wallpapers
    - cosmic-workspaces
    - xdg-desktop-portal-cosmic
    - desktop-file-utils
    - shared-mime-info
    - xdg-user-dirs-gtk
    - noto-sans-ttf
    - network-manager
    - wireplumber

install     : |
    mkdir -p $installdir/usr/share/doc/cosmic-desktop
    echo "cosmic meta package" > $installdir/usr/share/doc/cosmic-desktop/README
